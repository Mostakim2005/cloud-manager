name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Prepare CI log directory
        run: mkdir -p .ci-logs build

      - name: 1. Install Go & Node dependencies
        run: |
          set -o pipefail
          go mod tidy 2>&1 | tee .ci-logs/01-install.log
          cd web && npm install --no-audit --no-fund 2>&1 | tee -a ../.ci-logs/01-install.log

      - name: 2. Format & Lint (Go + TypeScript)
        run: |
          set -o pipefail
          UNFMT=$(gofmt -l cmd internal)
          if [ -n "$UNFMT" ]; then
            echo "Unformatted Go files:" | tee .ci-logs/02-format-lint.log
            echo "$UNFMT" | tee -a .ci-logs/02-format-lint.log
            exit 1
          fi
          go vet ./cmd/... ./internal/... 2>&1 | tee .ci-logs/02-format-lint.log
          cd web && npm run lint 2>&1 | tee -a ../.ci-logs/02-format-lint.log

      - name: 3. Static Type Check (TypeScript)
        run: |
          set -o pipefail
          cd web && npx tsc --noEmit 2>&1 | tee ../.ci-logs/03-typecheck.log

      - name: 4. Frontend Unit, Theme Contrast & A11y Tests
        run: |
          set -o pipefail
          cd web && npm test 2>&1 | tee ../.ci-logs/04-frontend-tests.log

      - name: 5. Build TypeScript UI for Go Embed
        run: |
          set -o pipefail
          cd web && npm run build 2>&1 | tee ../.ci-logs/05-frontend-build.log
          test -f ../internal/webui/dist/index.html

      - name: 6. Backend Unit, Concurrency & Security Regression Tests
        run: |
          set -o pipefail
          go test -race -v ./cmd/... ./internal/... 2>&1 | tee .ci-logs/06-backend-tests.log

      - name: 7. Security Audit & Cross-Compile Windows Portable Binaries
        run: |
          set -o pipefail
          cd web && npm audit --audit-level=high 2>&1 | tee ../.ci-logs/07-build-windows.log || true
          cd ..
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w -H=windowsgui" -o build/CloudManager.exe ./cmd/CloudManager 2>&1 | tee -a .ci-logs/07-build-windows.log
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/cloud-manager.exe ./cmd/cloud-manager 2>&1 | tee -a .ci-logs/07-build-windows.log
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o build/cloud-managerd.exe ./cmd/cloud-managerd 2>&1 | tee -a .ci-logs/07-build-windows.log
          ls -lh build/*.exe | tee -a .ci-logs/07-build-windows.log

      - name: 8. Structure, Doc Parity & UTF-8 No-BOM Checks
        run: |
          set -o pipefail
          python3 - <<'PY' 2>&1 | tee .ci-logs/08-structure-docs.log
          import pathlib, re
          docs = sorted(pathlib.Path("docs").rglob("*.md"))
          assert docs, "docs/ must contain Markdown docs"
          header_re = re.compile(r"^### \[(FEATURE|WISHLIST|SUBSYSTEM|FLOW|DECISION|TRAP): [^\]]+\]")
          for d in docs:
              raw = d.read_bytes()
              assert not raw.startswith(b"\xef\xbb\xbf"), f"{d} has UTF-8 BOM"
              lines = raw.decode("utf-8").splitlines()
              for idx, line in enumerate(lines):
                  if header_re.match(line):
                      assert idx + 1 < len(lines) and lines[idx + 1].startswith("> **1-Line Summary:**"), (
                          f"{d}:{idx+1} missing immediate '> **1-Line Summary:**' line"
                      )
          for jf in list(pathlib.Path(".").glob("*.json")) + list(pathlib.Path("web").glob("*.json")):
              assert not jf.read_bytes().startswith(b"\xef\xbb\xbf"), f"{jf} has UTF-8 BOM"
          assert pathlib.Path("LICENSE").is_file()
          assert pathlib.Path("THIRD_PARTY_NOTICES.md").is_file()
          print(f"Verified {len(docs)} docs, JSON BOM hygiene, LICENSE, and notices cleanly.")
          PY

      - name: Upload Windows Portable Binaries
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-manager-windows-binaries
          path: build/*.exe
          retention-days: 14

      - name: Generate patch-ready CI failure report
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re, subprocess
          repo_slug = os.environ.get("GITHUB_REPOSITORY", "Mostakim2005/cloud-manager").split("/")[-1]
          repo_title = " ".join(w.capitalize() for w in re.split(r"[-_]+", repo_slug) if w) or repo_slug
          report_dir = pathlib.Path(".ci-report")
          report_dir.mkdir(exist_ok=True)
          report_path = report_dir / f"{repo_title} - CI Failure Report.md"
          def run_cmd(cmd):
              return subprocess.run(cmd, capture_output=True, text=True).stdout.strip()
          branch = os.environ.get("GITHUB_REF_NAME", "unknown")
          sha = os.environ.get("GITHUB_SHA", "unknown")
          run_url = f"{os.environ.get('GITHUB_SERVER_URL', 'https://github.com')}/{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/{os.environ.get('GITHUB_RUN_ID', '')}"
          sections = [
              f"# {repo_title} - CI Failure Report",
              "",
              "| Field | Value |",
              "| :--- | :--- |",
              f"| **Repository** | `{os.environ.get('GITHUB_REPOSITORY', '')}` (`{repo_title}`) |",
              f"| **Branch / Ref** | `{branch}` |",
              f"| **Commit** | `{sha[:8]}` (`{sha}`) — {run_cmd(['git', 'log', '-1', '--pretty=%s'])} |",
              f"| **Job** | `{os.environ.get('GITHUB_JOB', 'verify-linux')}` |",
              f"| **Workflow Run** | {run_url} |",
              f"| **Generated** | {datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')} |",
              "",
              "## Triggering Commit Summary",
              "```text",
              run_cmd(["git", "show", "--stat", "--no-color", "--format=", "HEAD"]) or "(none)",
              "```",
              "",
              "## Stage Logs",
          ]
          for lf in sorted(pathlib.Path(".ci-logs").glob("*.log")):
              content = lf.read_text(encoding="utf-8", errors="replace").strip()[-8000:]
              sections.extend([f"### `{lf.name}`", "```text", content or "(empty)", "```", ""])
          sections.extend([
              "## Triggering Commit Diff Excerpt",
              "```diff",
              (run_cmd(["git", "show", "--no-color", "--format=", "HEAD"])[:12000]) or "(none)",
              "```",
          ])
          report_path.write_text("\n".join(sections) + "\n", encoding="utf-8")
          PY

      - name: Upload patch-ready CI failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report
          path: .ci-report/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package.json

      - name: Prepare Windows CI logs
        shell: pwsh
        run: New-Item -ItemType Directory -Path .ci-logs, build -Force | Out-Null

      - name: Install, Build UI & Run Windows-Native Go Tests (DPAPI + Job Objects)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod tidy 2>&1 | Tee-Object -FilePath .ci-logs\win-01-deps.log
          Push-Location web
          npm install --no-audit --no-fund 2>&1 | Tee-Object -FilePath ..\.ci-logs\win-01-deps.log -Append
          npm run build 2>&1 | Tee-Object -FilePath ..\.ci-logs\win-02-ui-build.log
          Pop-Location
          go test -v ./cmd/... ./internal/... 2>&1 | Tee-Object -FilePath .ci-logs\win-03-go-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows Executables, Installer & CLI Smoke Tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:CGO_ENABLED = '0'
          go build -trimpath -ldflags="-s -w -H=windowsgui" -o build\CloudManager.exe .\cmd\CloudManager
          go build -trimpath -ldflags="-s -w" -o build\cloud-manager.exe .\cmd\cloud-manager
          go build -trimpath -ldflags="-s -w" -o build\cloud-managerd.exe .\cmd\cloud-managerd
          .\build\cloud-manager.exe health --json | Tee-Object -FilePath .ci-logs\win-04-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cloud-manager.exe route test lecture.mp4 --origin recordings --json | Tee-Object -FilePath .ci-logs\win-04-smoke.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\cloud-manager.exe upgrade --dry-run --json | Tee-Object -FilePath .ci-logs\win-04-smoke.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress | Out-Null
          }
          & $iscc packaging\CloudManager.iss | Tee-Object -FilePath .ci-logs\win-05-installer.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows Installer Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-manager-windows-installer
          path: build/CloudManager-Setup.exe
          retention-days: 14

      - name: Generate Windows CI failure report
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, os, pathlib, re
          repo_slug = os.environ.get("GITHUB_REPOSITORY", "Mostakim2005/cloud-manager").split("/")[-1]
          repo_title = " ".join(w.capitalize() for w in re.split(r"[-_]+", repo_slug) if w) or repo_slug
          report_dir = pathlib.Path(".ci-report")
          report_dir.mkdir(exist_ok=True)
          report_path = report_dir / f"{repo_title} - CI Failure Report.md"
          sections = [f"# {repo_title} - CI Failure Report (Windows)", "", f"- Generated: {datetime.datetime.now(datetime.timezone.utc).isoformat()}", ""]
          for lf in sorted(pathlib.Path(".ci-logs").glob("*.log")):
              sections.extend([f"### `{lf.name}`", "```text", lf.read_text(encoding="utf-8", errors="replace")[-8000:], "```", ""])
          report_path.write_text("\n".join(sections) + "\n", encoding="utf-8")
          PY

      - name: Upload Windows CI failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-report
          path: .ci-report/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
