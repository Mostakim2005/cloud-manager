name: Release Portable Windows Build

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build Embedded TypeScript UI
        run: |
          cd web
          npm install --no-audit --no-fund
          npm run build

      - name: Build Portable Windows x64 Binaries
        run: |
          mkdir -p release-assets
          go mod tidy
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release-assets/CloudManager.exe ./cmd/CloudManager
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release-assets/cloud-manager.exe ./cmd/cloud-manager
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o release-assets/cloud-managerd.exe ./cmd/cloud-managerd
          cd release-assets && sha256sum *.exe > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/CloudManager.exe
            release-assets/cloud-manager.exe
            release-assets/cloud-managerd.exe
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
